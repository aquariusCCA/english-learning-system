<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 210" font-family="'PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <text x="20" y="26" font-size="15" font-weight="bold" fill="#c2185b">過去完成式（較早）＋過去簡單式（較晚）</text>

  <!-- 時間軸 -->
  <line x1="40" y1="150" x2="628" y2="150" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="602" y="140" font-size="13" fill="#666">時間</text>
  <text x="44" y="176" font-size="14" font-style="italic" fill="#666">past</text>
  <text x="590" y="176" font-size="14" font-style="italic" fill="#666">future</text>

  <!-- 過去 B（10:00）：較早發生 → 過去完成式 -->
  <text x="165" y="40" font-size="12" fill="#999" text-anchor="middle">（較早發生）</text>
  <rect x="112" y="46" width="106" height="26" rx="6" fill="#fde4f2" stroke="#e6007e"/>
  <text x="165" y="63" font-size="13" fill="#c2185b" text-anchor="middle" font-weight="bold">過去完成式</text>
  <line x1="165" y1="72" x2="165" y2="141" stroke="#e6007e" stroke-width="1.2"/>
  <line x1="157" y1="143" x2="173" y2="159" stroke="#e6007e" stroke-width="3.5"/>
  <line x1="157" y1="159" x2="173" y2="143" stroke="#e6007e" stroke-width="3.5"/>
  <text x="165" y="176" font-size="13" fill="#333" text-anchor="middle">過去 B</text>
  <text x="165" y="194" font-size="13" font-style="italic" fill="#666" text-anchor="middle">10:00</text>

  <!-- 過去 A（13:00）：較晚發生 → 過去簡單式 -->
  <text x="360" y="40" font-size="12" fill="#999" text-anchor="middle">（較晚發生）</text>
  <rect x="307" y="46" width="106" height="26" rx="6" fill="#f2f2f2" stroke="#666"/>
  <text x="360" y="63" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">過去簡單式</text>
  <line x1="360" y1="72" x2="360" y2="141" stroke="#888" stroke-width="1.2"/>
  <line x1="352" y1="143" x2="368" y2="159" stroke="#333" stroke-width="3.5"/>
  <line x1="352" y1="159" x2="368" y2="143" stroke="#333" stroke-width="3.5"/>
  <text x="360" y="176" font-size="13" fill="#333" text-anchor="middle">過去 A</text>
  <text x="360" y="194" font-size="13" font-style="italic" fill="#666" text-anchor="middle">13:00</text>

  <!-- 現在（15:00） -->
  <circle cx="540" cy="150" r="5" fill="#888"/>
  <text x="540" y="176" font-size="13" fill="#333" text-anchor="middle">現在</text>
  <text x="540" y="194" font-size="13" font-style="italic" fill="#666" text-anchor="middle">15:00</text>
</svg>
