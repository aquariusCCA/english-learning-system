<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 200" font-family="'PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="nowarrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#e6007e"/>
    </marker>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#fde4f2"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#e6007e" stroke-width="2"/>
    </pattern>
  </defs>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#c2185b">進行式：三段「持續區間」</text>

  <!-- 時間軸 -->
  <line x1="40" y1="140" x2="628" y2="140" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="44" y="164" font-size="14" font-style="italic" fill="#666">past 過去</text>
  <text x="556" y="164" font-size="14" font-style="italic" fill="#666">future 未來</text>

  <!-- now：現在此刻 -->
  <line x1="334" y1="72" x2="334" y2="126" stroke="#e6007e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#nowarrow)"/>
  <text x="334" y="168" font-size="13" fill="#e6007e" text-anchor="middle" font-weight="bold">now 現在此刻</text>

  <!-- 過去進行式 -->
  <line x1="160" y1="72" x2="160" y2="131" stroke="#e6007e" stroke-width="1.2"/>
  <rect x="110" y="44" width="100" height="28" rx="6" fill="#fde4f2" stroke="#e6007e"/>
  <text x="160" y="62" font-size="13" fill="#333" text-anchor="middle">過去進行式</text>
  <rect x="125" y="131" width="70" height="18" rx="3" fill="url(#hatch)" stroke="#e6007e"/>

  <!-- 現在進行式 -->
  <rect x="284" y="44" width="100" height="28" rx="6" fill="#fde4f2" stroke="#e6007e"/>
  <text x="334" y="62" font-size="13" fill="#333" text-anchor="middle">現在進行式</text>
  <rect x="299" y="131" width="70" height="18" rx="3" fill="url(#hatch)" stroke="#e6007e"/>

  <!-- 未來進行式 -->
  <line x1="508" y1="72" x2="508" y2="131" stroke="#e6007e" stroke-width="1.2"/>
  <rect x="458" y="44" width="100" height="28" rx="6" fill="#fde4f2" stroke="#e6007e"/>
  <text x="508" y="62" font-size="13" fill="#333" text-anchor="middle">未來進行式</text>
  <rect x="473" y="131" width="70" height="18" rx="3" fill="url(#hatch)" stroke="#e6007e"/>
</svg>
